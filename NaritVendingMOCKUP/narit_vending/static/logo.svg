<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" width="400" height="90">
  <defs>
    <linearGradient id="grad-cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Brand Icon Badge -->
  <g transform="translate(10, 10)">
    <!-- Hexagonal / Isometric Vending Box Frame -->
    <rect x="5" y="5" width="60" height="60" rx="14" fill="#0f172a" stroke="url(#grad-cyan-blue)" stroke-width="2" />
    
    <!-- 3-Axis Orbit Ring (Astronomy & 3D Motion) -->
    <ellipse cx="35" cy="35" rx="24" ry="9" fill="none" stroke="url(#grad-violet)" stroke-width="1.8" transform="rotate(-30, 35, 35)" stroke-dasharray="2 1" opacity="0.8" />
    
    <!-- Coordinate Motion Grid Lines -->
    <path d="M35 17 L35 53 M19 44 L35 35 L51 44" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Telescope Star / Core Pulse Node -->
    <circle cx="35" cy="35" r="4.5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="35" cy="35" r="2" fill="#ffffff" />

    <!-- Corner Motion Targets -->
    <circle cx="35" cy="17" r="2" fill="#a855f7" />
    <circle cx="19" cy="44" r="2" fill="#a855f7" />
    <circle cx="51" cy="44" r="2" fill="#a855f7" />
  </g>

  <!-- Typography -->
  <g transform="translate(88, 20)">
    <!-- Main Title: NARIT -->
    <text x="0" y="27" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="900" font-size="28" fill="url(#text-grad)" letter-spacing="2">
      NARIT
    </text>
    
    <!-- VENDING MACHINE Badge -->
    <text x="100" y="27" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="16" fill="#38bdf8" letter-spacing="1.5">
      VENDING
    </text>

    <!-- Subtitle: Smart Motion Control -->
    <text x="2" y="47" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="11" fill="#94a3b8" letter-spacing="3.5">
      SMART MOTION CONTROL 3-AXIS
    </text>
    
    <!-- Version Tag -->
    <rect x="238" y="37" width="38" height="14" rx="4" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.4)" stroke-width="1" />
    <text x="244" y="48" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="9" fill="#38bdf8">v3.0</text>
  </g>
</svg>
